services:
  - type: web
    name: notre-budget
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: notre-budget-db
          property: connectionString

databases:
  - name: notre-budget-db
    databaseName: budget
    user: budget_user
